<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${appName} + ' | Facility Dashboard'">SmartAsset Sentinel | Facility Dashboard</title>
    <style>
        :root { --bg:#f4f6f8; --card:#fff; --ink:#1d2733; --muted:#64748b; --line:#e2e8f0; --brand:#0f766e; --danger:#b91c1c; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
        header { background:var(--brand); color:#fff; padding:16px 24px; }
        header h1 { margin:0; font-size:1.4rem; }
        header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
        main { max-width:1200px; margin:0 auto; padding:20px; }
        section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:20px; }
        h2 { margin:0 0 12px; font-size:1.1rem; }
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; background:transparent; border:0; padding:0; }
        .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
        .stat span { display:block; color:var(--muted); font-size:.8rem; }
        .stat strong { font-size:1.6rem; }
        form { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; align-items:end; margin-bottom:14px; }
        label { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:4px; }
        input, select, textarea { padding:7px 8px; border:1px solid #cbd5e1; border-radius:6px; font:inherit; color:var(--ink); background:#fff; }
        button { padding:8px 12px; border:0; border-radius:6px; background:var(--brand); color:#fff; font:inherit; cursor:pointer; }
        button.danger { background:var(--danger); }
        button.secondary { background:#475569; }
        .filters { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:.9rem; }
        th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; }
        th { color:var(--muted); font-weight:600; font-size:.8rem; }
        td .actions { display:flex; gap:6px; flex-wrap:wrap; }
        .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.75rem; font-weight:600; margin-right:6px; background:#e2e8f0; }
        .badge.OPERATIONAL, .badge.COMPLETED { background:#dcfce7; color:#166534; }
        .badge.UNDER_MAINTENANCE, .badge.IN_PROGRESS { background:#fef9c3; color:#854d0e; }
        .badge.OFFLINE, .badge.CANCELLED, .badge.CRITICAL { background:#fee2e2; color:#991b1b; }
        .badge.OPEN, .badge.HIGH { background:#ffedd5; color:#9a3412; }
        .toast { position:fixed; right:20px; top:20px; max-width:380px; padding:12px 16px; border-radius:8px; color:#fff; z-index:10; box-shadow:0 4px 14px rgba(0,0,0,.2); }
        .toast.success { background:#15803d; }
        .toast.error { background:#b91c1c; }
        .toast[hidden] { display:none; }
        @media (max-width:600px) { main { padding:12px; } header { padding:14px 16px; } }
    </style>
</head>
<body>
<header>
    <h1 id="page-title" data-testid="page-title" th:text="${appName}">SmartAsset Sentinel</h1>
    <p>Facility &amp; Asset Management Dashboard</p>
</header>

<div id="toast" class="toast" role="status" data-testid="toast" data-state="idle" hidden></div>

<main>
    <section class="stats" aria-label="Summary">
        <div class="stat"><span>Total assets</span><strong id="stat-total" data-testid="stat-total">0</strong></div>
        <div class="stat"><span>Operational</span><strong id="stat-operational" data-testid="stat-operational">0</strong></div>
        <div class="stat"><span>Under maintenance</span><strong id="stat-maintenance" data-testid="stat-maintenance">0</strong></div>
        <div class="stat"><span>Offline</span><strong id="stat-offline" data-testid="stat-offline">0</strong></div>
        <div class="stat"><span>Active work orders</span><strong id="stat-active-wo" data-testid="stat-active-wo">0</strong></div>
    </section>

    <section aria-labelledby="assets-heading">
        <h2 id="assets-heading">Assets</h2>
        <form id="asset-form" data-testid="asset-form" novalidate>
            <label>Name
                <input id="asset-name" name="name" data-testid="asset-name" type="text" maxlength="120" placeholder="Rooftop HVAC Unit B">
            </label>
            <label>Type
                <select id="asset-type" name="type" data-testid="asset-type">
                    <option th:each="t : ${assetTypes}" th:value="${t}" th:text="${t}">HVAC</option>
                </select>
            </label>
            <label>Location
                <input id="asset-location" name="location" data-testid="asset-location" type="text" maxlength="120" placeholder="Building 1 - Roof">
            </label>
            <label>Serial number
                <input id="asset-serial" name="serialNumber" data-testid="asset-serial" type="text" maxlength="60" placeholder="HVAC-1002">
            </label>
            <label>Install date
                <input id="asset-install-date" name="installDate" data-testid="asset-install-date" type="date">
            </label>
            <button id="asset-submit" data-testid="asset-submit" type="submit">Add asset</button>
        </form>

        <div class="filters">
            <label>Filter by type
                <select id="filter-type" data-testid="filter-type">
                    <option value="">All types</option>
                    <option th:each="t : ${assetTypes}" th:value="${t}" th:text="${t}">HVAC</option>
                </select>
            </label>
            <label>Filter by status
                <select id="filter-status" data-testid="filter-status">
                    <option value="">All statuses</option>
                    <option th:each="s : ${assetStatuses}" th:value="${s}" th:text="${s}">OPERATIONAL</option>
                </select>
            </label>
        </div>

        <div class="table-wrap">
            <table id="asset-table" data-testid="asset-table">
                <thead><tr>
                    <th>ID</th><th>Name</th><th>Type</th><th>Location</th>
                    <th>Serial</th><th>Status</th><th>Last service</th><th>Actions</th>
                </tr></thead>
                <tbody id="asset-rows" data-testid="asset-rows"></tbody>
            </table>
        </div>
    </section>

    <section aria-labelledby="wo-heading">
        <h2 id="wo-heading">Maintenance Work Orders</h2>
        <form id="wo-form" data-testid="wo-form" novalidate>
            <label>Title
                <input id="wo-title" name="title" data-testid="wo-title" type="text" maxlength="150" placeholder="Replace air filter">
            </label>
            <label>Description
                <input id="wo-description" name="description" data-testid="wo-description" type="text" maxlength="1000">
            </label>
            <label>Priority
                <select id="wo-priority" name="priority" data-testid="wo-priority">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">MEDIUM</option>
                </select>
            </label>
            <label>Asset
                <select id="wo-asset" name="assetId" data-testid="wo-asset"></select>
            </label>
            <button id="wo-submit" data-testid="wo-submit" type="submit">Create work order</button>
        </form>

        <div class="table-wrap">
            <table id="wo-table" data-testid="wo-table">
                <thead><tr>
                    <th>ID</th><th>Title</th><th>Asset</th><th>Priority</th>
                    <th>Status</th><th>Created</th><th>Actions</th>
                </tr></thead>
                <tbody id="wo-rows" data-testid="wo-rows"></tbody>
            </table>
        </div>
    </section>
</main>

<script th:inline="none">
    (function () {
        'use strict';

        const API_ASSETS = '/api/assets';
        const API_WO = '/api/work-orders';
        const STATUSES = Array.from(document.getElementById('filter-status').options)
            .map(function (o) { return o.value; })
            .filter(Boolean);

        let assets = [];
        let workOrders = [];
        let toastTimer = null;

        function $(id) { return document.getElementById(id); }

        function esc(value) {
            return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function showToast(message, isError) {
            const toast = $('toast');
            toast.textContent = message;
            toast.className = 'toast ' + (isError ? 'error' : 'success');
            toast.dataset.state = isError ? 'error' : 'success';
            toast.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.hidden = true;
                toast.dataset.state = 'idle';
            }, 6000);
        }

        function describeError(body, status) {
            if (body && body.fieldErrors) {
                return Object.entries(body.fieldErrors)
                    .map(function (e) { return e[0] + ': ' + e[1]; })
                    .join('; ');
            }
            return (body && body.message) || ('Request failed with HTTP ' + status);
        }

        async function api(url, options) {
            const opts = Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {});
            const res = await fetch(url, opts);
            if (res.status === 204) { return null; }
            let body = null;
            try { body = await res.json(); } catch (e) { body = null; }
            if (!res.ok) { throw new Error(describeError(body, res.status)); }
            return body;
        }

        async function refresh() {
            try {
                const results = await Promise.all([api(API_ASSETS), api(API_WO)]);
                assets = results[0];
                workOrders = results[1];
                renderAll();
                document.body.setAttribute('data-loaded', 'true');
            } catch (err) {
                showToast('Failed to load data: ' + err.message, true);
            }
        }

        function renderAll() {
            renderStats();
            renderAssets();
            renderAssetOptions();
            renderWorkOrders();
        }

        function renderStats() {
            const count = function (s) { return assets.filter(function (a) { return a.status === s; }).length; };
            $('stat-total').textContent = assets.length;
            $('stat-operational').textContent = count('OPERATIONAL');
            $('stat-maintenance').textContent = count('UNDER_MAINTENANCE');
            $('stat-offline').textContent = count('OFFLINE');
            $('stat-active-wo').textContent = workOrders.filter(function (w) {
                return w.status === 'OPEN' || w.status === 'IN_PROGRESS';
            }).length;
        }

        function assetRow(a) {
            const options = STATUSES.map(function (s) {
                return `<option value="${s}"${s === a.status ? ' selected' : ''}>${s}</option>`;
            }).join('');
            return `<tr data-testid="asset-row-${a.id}" data-asset-id="${a.id}">
                <td>${a.id}</td>
                <td data-testid="asset-name-${a.id}">${esc(a.name)}</td>
                <td data-testid="asset-type-${a.id}">${esc(a.type)}</td>
                <td>${esc(a.location)}</td>
                <td data-testid="asset-serial-${a.id}">${esc(a.serialNumber)}</td>
                <td>
                    <span class="badge ${esc(a.status)}" data-testid="asset-status-${a.id}">${esc(a.status)}</span>
                    <select data-action="asset-status" data-id="${a.id}" data-testid="asset-status-select-${a.id}" aria-label="Change status">${options}</select>
                </td>
                <td>${esc(a.lastServiceDate || '-')}</td>
                <td><button type="button" class="danger" data-action="delete-asset" data-id="${a.id}" data-testid="delete-asset-${a.id}">Delete</button></td>
            </tr>`;
        }

        function renderAssets() {
            const type = $('filter-type').value;
            const status = $('filter-status').value;
            const rows = assets.filter(function (a) {
                return (!type || a.type === type) && (!status || a.status === status);
            });
            $('asset-rows').innerHTML = rows.length
                ? rows.map(assetRow).join('')
                : '<tr><td colspan="8" data-testid="asset-empty">No assets found</td></tr>';
        }

        function renderAssetOptions() {
            const select = $('wo-asset');
            const previous = select.value;
            select.innerHTML = '<option value="">Select asset</option>' + assets.map(function (a) {
                return `<option value="${a.id}">${a.id} - ${esc(a.name)}</option>`;
            }).join('');
            if (previous && assets.some(function (a) { return String(a.id) === previous; })) {
                select.value = previous;
            }
        }

        function woButton(w, target, label, css) {
            return `<button type="button" class="${css}" data-action="wo-status" data-id="${w.id}" data-status="${target}" data-testid="wo-${label.toLowerCase()}-${w.id}">${label}</button>`;
        }

        function woActions(w) {
            if (w.status === 'OPEN') {
                return woButton(w, 'IN_PROGRESS', 'Start', '') + woButton(w, 'CANCELLED', 'Cancel', 'secondary');
            }
            if (w.status === 'IN_PROGRESS') {
                return woButton(w, 'COMPLETED', 'Complete', '') + woButton(w, 'CANCELLED', 'Cancel', 'secondary');
            }
            return '-';
        }

        function workOrderRow(w) {
            const created = String(w.createdAt || '').replace('T', ' ').slice(0, 16);
            return `<tr data-testid="wo-row-${w.id}" data-wo-id="${w.id}">
                <td>${w.id}</td>
                <td data-testid="wo-title-${w.id}">${esc(w.title)}</td>
                <td data-testid="wo-asset-${w.id}">${esc(w.assetName)}</td>
                <td><span class="badge ${esc(w.priority)}">${esc(w.priority)}</span></td>
                <td><span class="badge ${esc(w.status)}" data-testid="wo-status-${w.id}">${esc(w.status)}</span></td>
                <td>${esc(created)}</td>
                <td><div class="actions">${woActions(w)}</div></td>
            </tr>`;
        }

        function renderWorkOrders() {
            $('wo-rows').innerHTML = workOrders.length
                ? workOrders.map(workOrderRow).join('')
                : '<tr><td colspan="7" data-testid="wo-empty">No work orders found</td></tr>';
        }

        $('asset-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const payload = {
                name: $('asset-name').value.trim(),
                type: $('asset-type').value,
                location: $('asset-location').value.trim(),
                serialNumber: $('asset-serial').value.trim(),
                installDate: $('asset-install-date').value || null
            };
            try {
                const created = await api(API_ASSETS, { method: 'POST', body: JSON.stringify(payload) });
                showToast(`Asset "${created.name}" created (id ${created.id})`, false);
                e.target.reset();
                await refresh();
            } catch (err) {
                showToast(err.message, true);
            }
        });

        $('wo-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const assetValue = $('wo-asset').value;
            const payload = {
                title: $('wo-title').value.trim(),
                description: $('wo-description').value.trim() || null,
                priority: $('wo-priority').value,
                assetId: assetValue ? Number(assetValue) : null
            };
            try {
                const created = await api(API_WO, { method: 'POST', body: JSON.stringify(payload) });
                showToast(`Work order "${created.title}" created (id ${created.id})`, false);
                e.target.reset();
                await refresh();
            } catch (err) {
                showToast(err.message, true);
            }
        });

        $('filter-type').addEventListener('change', renderAssets);
        $('filter-status').addEventListener('change', renderAssets);

        $('asset-rows').addEventListener('change', async function (e) {
            const select = e.target.closest('select[data-action="asset-status"]');
            if (!select) { return; }
            const asset = assets.find(function (a) { return String(a.id) === select.dataset.id; });
            if (!asset) { return; }
            try {
                await api(`${API_ASSETS}/${asset.id}`, {
                    method: 'PUT',
                    body: JSON.stringify(Object.assign({}, asset, { status: select.value }))
                });
                showToast(`Asset ${asset.id} status set to ${select.value}`, false);
            } catch (err) {
                showToast(err.message, true);
            }
            await refresh();
        });

        document.addEventListener('click', async function (e) {
            const button = e.target.closest('button[data-action]');
            if (!button) { return; }
            const id = button.dataset.id;
            try {
                if (button.dataset.action === 'delete-asset') {
                    await api(`${API_ASSETS}/${id}`, { method: 'DELETE' });
                    showToast(`Asset ${id} deleted`, false);
                } else if (button.dataset.action === 'wo-status') {
                    await api(`${API_WO}/${id}/status`, {
                        method: 'PATCH',
                        body: JSON.stringify({ status: button.dataset.status })
                    });
                    showToast(`Work order ${id} is now ${button.dataset.status}`, false);
                }
                await refresh();
            } catch (err) {
                showToast(err.message, true);
            }
        });

        refresh();
    })();
</script>
</body>
</html>
