spring.application.name=mock-asset-service
server.port=8080

# In-memory H2 (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:assetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.thymeleaf.cache=false

# H2 TCP listener for JDBC assertions from a separate QA JVM.
# JDBC URL: jdbc:h2:tcp://localhost:9092/mem:assetdb (user: sa, empty password)
sentinel.h2.tcp.enabled=true
sentinel.h2.tcp.port=9092

sentinel.seed.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
